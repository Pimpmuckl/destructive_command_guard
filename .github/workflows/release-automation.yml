name: release-automation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: release-automation
  cancel-in-progress: false

jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify distribution workflow is active
        # A release tag is not useful when the workflow that builds its
        # cross-platform artifacts is disabled. Fail before creating the tag,
        # rather than leaving users with a platform-incomplete release (#238).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/dist.yml" \
              --jq '.state'
          )"
          if [[ "$state" != "active" ]]; then
            echo "::error::dist.yml must be active before creating a release tag (state=$state)"
            exit 1
          fi

      - name: Read version from Cargo.toml
        id: version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "::error::Unable to parse version from Cargo.toml"
            exit 1
          fi
          if ! git check-ref-format "refs/tags/v$version" >/dev/null; then
            echo "::error::Cargo.toml version does not form a valid release tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Inspect release tag
        id: release_tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.release_tag.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          echo "Creating release tag $TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          # Push events created with GITHUB_TOKEN do not start other workflows.
          # workflow_dispatch is the documented exception, so start dist
          # explicitly against the immutable tag that contains its workflow.
          gh workflow run dist.yml --ref "$TAG"

      - name: Retry distribution for existing tag
        if: github.event_name == 'workflow_dispatch' && steps.release_tag.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          echo "Dispatching distribution retry for existing tag $TAG"
          gh workflow run dist.yml --ref "$TAG"

      - name: Skip automatic run (already tagged)
        if: github.event_name != 'workflow_dispatch' && steps.release_tag.outputs.exists == 'true'
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          echo "$TAG already exists; nothing to do."
